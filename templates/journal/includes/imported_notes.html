<ol>{% for entry in imported_notes %}<li id="{{ entry.citation.note_anchor }}"><span id="source-{{ entry.citation.source_key }}">{{ entry.citation.number }}</span><p>{% if entry.source %}{% if entry.source.url %}<a href="{{ entry.source.url }}" target="_blank" rel="noopener noreferrer">{{ entry.source.bibliography }}</a>{% else %}{{ entry.source.bibliography }}{% endif %}{% else %}<strong>Missing source: {{ entry.citation.source_key }}</strong>{% endif %}</p></li>{% endfor %}</ol>
