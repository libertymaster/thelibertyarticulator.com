# Local-only browser access. No Cloudflare token or Access application is used.
services:
  web:
    ports: [127.0.0.1:8080:8000]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REQUIRE_CF_ACCESS: "0"
      PUBLIC_ORIGIN: http://localhost:8080
  worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REQUIRE_CF_ACCESS: "0"
  beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REQUIRE_CF_ACCESS: "0"
  migrate:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      REQUIRE_CF_ACCESS: "0"
