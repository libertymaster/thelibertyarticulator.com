global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    cluster: liberty

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: blackbox_exporter
    static_configs:
      - targets:
          - blackbox_exporter:9115

  - job_name: blackbox_https
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://thelibertyarticulator.com/health/
          - https://auth.thelibertyarticulator.com/api/status
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

